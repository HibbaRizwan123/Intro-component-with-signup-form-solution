<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
  rel="stylesheet">
  <title>Intro component with sign up form</title>
</head>
<body>
  <div class="intro">
      <h1>
        Learn to code by watching others
      </h1>
      <p>
        See how experienced developers solve problems in real-time. Watching scripted tutorials is great,
        but understanding how developers think is invaluable. 
      </p>
  </div>
  <div class="signup-form">
    <button class="primary-btn">
      <strong>
        Try it free 7 days
      </strong> 
      then $20/mo. thereafter
    </button>
    <form>
      <p id="success-message" class="success-message"></p>
      <div class="input-group">
        <input type="text" id="first-name" placeholder="First Name"/>
        <img src="images/icon-error.svg" class="error-icon" alt=""/>
        <span id="first-name-error" class="error-text"></span>
      </div>
      <div class="input-group">
        <input type="text" id="last-name" placeholder="Last Name"/>
        <img src="images/icon-error.svg" class="error-icon" alt=""/>
        <span id="last-name-error" class="error-text"></span>
      </div>
      <div class="input-group">
        <input type="email" id="email" placeholder="Email Address"/>
        <img src="images/icon-error.svg" class="error-icon" alt=""/>
        <span id="email-error" class="error-text"></span>
      </div>
      <div class="input-group">
        <input type="password" id="password" placeholder="Password"/>
        <img src="images/icon-error.svg" class="error-icon" alt=""/>
        <span id="password-error" class="error-text"></span>
      </div>

      <button class="form-btn">
        CLAIM YOUR FREE TRIAL
      </button>
      <p> 
        By clicking the button, you are agreeing to our <strong>Terms and Services</strong>
      </p>
    </form>
  </div>
  <script 
  src="index.js"></script>
</body>
</html>
